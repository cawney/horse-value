<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/css/adminlte.min.css" />
  </head>
  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      <nav class='app-header navbar navbar-expand bg-body'>
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class='nav-item'>
              <a href="#" class="nav-link" data-lte-toggle="sidebar" role="button">
                <i class="bi bi-list"></i>
              </a>
            </li>
          </ul>
        </div>
      </nav>
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="#" class="brand-link">
            <span class="brand-text fw-light">Horse Value</span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
              <li class="nav-item">
                <a href="#" class="nav-link active">
                  <i class="nav-icon bi bi-speedometer">
                    <p>Dashboard</p>
                  </i>
                </a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">
                  <i class="nav-icon bi bi-bar-chart">
                    <p>Reports</p>
                  </i>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>
      <!-- Main content -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <h3 class="mb-0">Horse Value</h3>
          </div>
        </div>
        <div class="app-content">
          <div class="container-fluid">
            <div class="card">
              <div class="card-header"><h5 class="card-title">Welcome</h5></div>
              <div class="card-body">
                This is the first card body for the HTML face of horse-value.
              </div>
            </div>
            <div class="card">
              <div class="card-header"><h5 class="card-title">Search Dam and Year Foaled</h5></div>
              <div class="card-body">
                <form id="search-form" class="row g-2 mb-3" autocomplete="off">
                  <div class="col-sm-6">
                    <input id="dam" class="form-control" placeholder="Dam name" required>
                  </div>
                  <div class="col-sm-3">
                    <input type="number" id="yob" class="form-control" placeholder="YOB (optional)">
                  </div>
                  <div class="col-sm-3">
                    <button id="search-btn" class="btn btn-primary w-100" type="submit" disabled>Loading...</button>
                  </div>
                </form>
                <p id="status" class="text-body-secondary"></p>
                <table class="table table-striped table-sm">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>YOB</th>
                      <th>Dam</th>
                      <th>Sire</th>
                      <th>Sales</th>
                    </tr>
                  </thead>
                  <tbody id="results"></tbody>
                </table>
              </div>
            </div>
            <script src="index.js"></script>
            <script>
              const abs = p => new URL(p, document.baseURI).toString();
              let db = null;

              //normalize name...
              const normalize = s => s.toUpperCase().replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trim();

              // start database when page loads, resue it for every search

              createDbWorker(
                [{ from: "jsonconfig", configUrl: abs("db-config.json?v=" + Date.now()) }],
                abs("sqlite.worker.js"),
                abs("sql-wasm.wasm")
            ).then(async worker => {
              db = worker.db;
              const btn = document.getElementById("search-btn");
              btn.disabled = false;
              btn.textContent = "Search";
            }).catch(err => {
              document.getElementById("status").textContent = "Error: " + err;
            });

            document.getElementById("search-form").addEventListener("submit", async e => {
              e.preventDefault();
              const dam = normalize(document.getElementById("dam").value);
              const yob = document.getElementById("yob").value;
              const status = document.getElementById("status");
              const tbody = document.getElementById("results");
              if (!db || !dam) return;

              status.textContent = "Searching...";
              tbody.innerHTML = "";

              //Dam names... starting with what was typed
              let inner = `
                SELECT h.name, h.year_foaled, d.name AS dam, s.name AS sire
                FROM horses d
                JOIN horses h ON h.dam_id = d.horse_id
                LEFT JOIN horses s ON s.horse_id = h.sire_id
                WHERE d.name_norm >= ? and d.name_norm < ?`;
              const params = [dam, dam + "\uffff"];
              if (yob) {
                sql += " AND h.year_foaled = ?";
                params.push(Number(yob));
              }
              sql += " ORDER BY d.name_norm, h.year_foaled DESC LIMIT 100";

              const sql = `
                SELECT f.*, sa.hip, sa.status, sa.price, sa.buyer, sa.horse_type,
                  e.company, e.sale_name, e.start_date
                FROM (${inner}) f
                LEFT JOIN sales sa ON sa.horse_id = f.horse_id
                LEFT JOIN sale_events e ON e.sale_id = sa.sale_id
                ORDER BY f.dam_id, f.year_foaled DESC, f.horse_id, e.start_date, e.sale_id`;

              const money = n => "$" + Number(n).ToLocaleString("en-US");
              const describeSale = r => {
                  let result = r.status;
                  if (r.status === "SOLD" && r.price != null) result = money(r.price);
                  else if (r.status === "RNA" && r.price != null) result = "RNA " + money(r.price);
                  else if (r.status === "PRIVATE") result = "Private" + (r.price != null ? " " + money(r.price) : "");
                  else if (r.status === "OUT") result = "Out";
                  return `${r.company ?? ""} ${r.sale_name ?? ""} - Hip ${r.hip} - ${result}` +
                    (r.status === "SOLD" && r.buyer ? ` (${r.buyer})` : "");
                };

              try {
                const rows = await db.query(sql, params);
                for (const r of rows) {
                  const tr = tbody.insertRow();
                  for (const v of [r.name || "(unnamed)", r.year_foaled ?? "", r.dam, r.sire ?? ""]) {
                    tr.insertCell().textContent = v;
                  }
                }
                status.textContent = rows.length === 100 ? "First 100 matches. Type more of the dam name to narrow it."
                                                         : `${rows.length} match${rows.length === 1 ? "" : "es"}`;
              } catch (err) {
                status.textContent = "Error: " + err;
              }
            });
            </script>
          </div>
        </div>
      </main>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.10.0/dist/js/adminlte.min.js"></script>
  </body>
</html>
